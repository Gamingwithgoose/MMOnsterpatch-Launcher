[OfficialServer]
# v0.12.8 ACCOUNT/STATUS FOUNDATION
# The current Python Official Server uses these previous/current live ports.
TradingPostPort=61526
SteamOpenIDHttpPort=61527
MMOPort=61528
SocialPort=61529

[ProductionDNS]
MMOHost=mmo.gamingwithgoose.com
TradingPostHost=mon.gamingwithgoose.com
SteamAuthUrl=https://mon-auth.gamingwithgoose.com

[Cloudflare]
# account and mon-auth are HTTP routes through Cloudflare Tunnel.
# mmo and mon are raw TCP and should stay DNS-only unless a later TCP proxy/Spectrum setup is intentionally added.
AccountRoute=https://account.gamingwithgoose.com -> http://127.0.0.1:8080
SteamAuthRoute=https://mon-auth.gamingwithgoose.com -> http://127.0.0.1:61527
MMORoute=mmo.gamingwithgoose.com -> DNS-only TCP 61528,61529
TradingPostRoute=mon.gamingwithgoose.com -> DNS-only TCP 61526
