[Advanced]

## If true, computes mailbox position from the detected ParentsHouse anchor plus AnchorOffsetX/Y. Default true for the confirmed My Town player-house mailbox placement.
# Setting type: Boolean
# Default value: true
UseParentHouseAnchor = true

## Only used when UseParentHouseAnchor=true.
# Setting type: Single
# Default value: -0.8
AnchorOffsetX = -0.8

## Only used when UseParentHouseAnchor=true.
# Setting type: Single
# Default value: 0.004
AnchorOffsetY = 0.004

[Debug]

## Logs nearby My Town barrel candidates once. Use this to tune TargetX/TargetY if the mailbox replaces the wrong barrel.
# Setting type: Boolean
# Default value: true
LogNearbyBarrelsOnce = true

## Radius around TargetX/TargetY for one-time candidate barrel logging.
# Setting type: Single
# Default value: 2
LogRadius = 2

[Home Mailbox]

## Enable the physical mailbox in My Town.
# Setting type: Boolean
# Default value: true
Enabled = true

## When true, replace the existing barrel nearest TargetX/TargetY with the mailbox sprite.
# Setting type: Boolean
# Default value: true
ReplaceNearbyBarrel = true

## When true, spawn a standalone mailbox at TargetX/TargetY if no nearby barrel is found.
# Setting type: Boolean
# Default value: true
SpawnIfMissing = true

[Interaction]

## Mailbox interaction collider width in world units.
# Setting type: Single
# Default value: 0.18
ColliderWidth = 0.18

## Mailbox interaction collider height in world units.
# Setting type: Single
# Default value: 0.18
ColliderHeight = 0.18

[Placement]

## World X coordinate for the My Town mailbox/barrel target. Tweak this to line up with the barrel beside the blue-roof player house.
# Setting type: Single
# Default value: -4
TargetX = -4

## World Y coordinate for the My Town mailbox/barrel target. Tweak this to line up with the barrel beside the blue-roof player house.
# Setting type: Single
# Default value: 24
TargetY = 24

## World Z coordinate for the mailbox target. Usually leave at 0.
# Setting type: Single
# Default value: 0
TargetZ = 0

## How close a barrel must be to TargetX/TargetY before it can be replaced. Keep this tight so the wrong doorway barrel is not selected.
# Setting type: Single
# Default value: 1
ReplaceRadius = 1

[Visual]

## Mailbox object scale. Use this to make the mailbox icon bigger/smaller in-world.
# Setting type: Single
# Default value: 1.6
Scale = 1.6

## Pixels-per-unit used when creating the embedded mailbox sprite. Higher values make the sprite smaller.
# Setting type: Single
# Default value: 160
PixelsPerUnit = 160

## When replacing a barrel prefab with child sprites, disables extra child renderers so the original barrel art does not remain visible.
# Setting type: Boolean
# Default value: true
DisableExtraChildRenderers = true

